<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Bricolage";src:url(../fonts/BricolageGrotesque.woff2) format("woff2")}
html,body{margin:0;width:1200px;height:630px;background:#F2EBDD;overflow:hidden}
.wrap{position:relative;width:1200px;height:630px;display:flex;align-items:center;gap:72px;padding:0 80px 0 96px;box-sizing:border-box;font-family:"Bricolage",sans-serif;color:#173C3A}
.me{width:360px;height:360px;flex:none;display:block}
.text{flex:1}
h1{margin:0;font-size:76px;line-height:0.98;font-weight:600;letter-spacing:-0.02em}
h1 span{display:block}
p.tag{margin:28px 0 0;font-size:34px;font-weight:500;color:#173C3A}
p.url{margin:44px 0 0;font-family:ui-monospace,Menlo,monospace;font-size:22px;color:rgba(23,60,58,.62);letter-spacing:.04em}
.band{position:absolute;right:-140px;top:-200px;width:260px;height:1100px;background:#BFD0CC;transform:rotate(24deg);z-index:0}
.me,.text{position:relative;z-index:1}
</style></head><body><div class="wrap"><div class="band"></div>
<img class="me" src="../favicon.svg">
<div class="text"><h1><span>Henrik</span><span>Larsson Hestnes</span></h1><p class="tag">Software, sport &amp; somewhere new.</p><p class="url">henrikhestnes.com</p></div>
</div></body></html>
